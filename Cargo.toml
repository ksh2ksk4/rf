[package]
edition = "2021"
name = "rf-ui"
version = "0.1.0"

[[bin]]
name = "rf-ui"
path = "frontend/main.rs"

[dependencies]
console_error_panic_hook = "0.1.7"
gloo = "0.11.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-utils = "0.2.0"
js-sys = "0.3"
once_cell = "1.21.3"
rf-common = { path = "rf-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "VisualViewport",
    "DomRect",
] }
yew = { version = "0.21", features = ["csr"] }

[workspace]
members = ["rf-common","src-tauri"]
